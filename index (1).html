<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montar Layout SVC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{display:['Unbounded','system-ui','sans-serif'],sans:['Onest','system-ui','sans-serif'],mono:['"JetBrains Mono"','ui-monospace','monospace']},
colors:{ink:'var(--ink)',muted:'var(--muted)',line:'var(--line)',accent:'var(--accent)',glass:'var(--glass)'}}}}
</script>
<style>
/* Layout: nav fixa translúcida (estilo Apple) → Bento Grid de vidro sobre fundo com gradientes suaves; planta do galpão como bloco principal */
:root{
  --bg:#07090d; --ink:#eef2f5; --muted:#8c97a3; --line:rgba(255,255,255,.09); --glass:rgba(22,27,34,.55);
  --accent:#4cc3ff; --amber:#ffb547;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:Onest,system-ui,sans-serif;min-height:100%;overflow-x:hidden}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:none;opacity:.10}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-12vw;top:-14vw;background:#0e6d9c}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-10vw;top:18vh;background:#b86b12;opacity:.16}
.aurora i:nth-child(3){width:50vw;height:40vw;left:30vw;bottom:-22vw;background:#123f7a;opacity:.3}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:22px 22px}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line)}
.sk{background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
.tnum{font-variant-numeric:tabular-nums}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spin{animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
.noscroll::-webkit-scrollbar{display:none}.noscroll{scrollbar-width:none}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}}

/* Otimização segura: mantém React/Framer originais */
.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}


/* SVC FAST UI: preserva componentes e elimina custo visual de transições/blur */
.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
</style>

<div class="aurora"><i></i><i></i><i></i></div>
<div class="grain"></div>
<div id="root" class="relative z-10"></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
/* Bibliotecas pesadas sob demanda: a tela abre primeiro. */
const SVC_LIBS={};
function svcLoadOne(url){return new Promise((resolve,reject)=>{const e=document.createElement("script");e.src=url;e.async=true;e.onload=()=>resolve(true);e.onerror=()=>{e.remove();reject(new Error("Falha "+url))};document.head.appendChild(e)})}
/* tenta cada endereço em ordem: se a rede da empresa bloquear um CDN, usa o próximo */
function svcLoadScript(key,urls,ok){
  if(SVC_LIBS[key])return SVC_LIBS[key];
  urls=[].concat(urls);
  SVC_LIBS[key]=(async()=>{for(const u of urls){try{await svcLoadOne(u);if(!ok||ok())return true}catch(e){}}delete SVC_LIBS[key];throw new Error("Falha ao carregar "+key)})();
  return SVC_LIBS[key];
}
const ensureXLSX=()=>window.XLSX?Promise.resolve(true):svcLoadScript("xlsx",["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js","https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"],()=>!!window.XLSX);
const ensureJSPDF=()=>window.jspdf?Promise.resolve(true):svcLoadScript("jspdf",["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"],()=>!!window.jspdf);
/* lê CSV/TXT respeitando a codificação (UTF-8, UTF-16 do Excel "Texto Unicode" ou ANSI/Latin-1) */
async function svcReadText(f){const buf=new Uint8Array(await f.arrayBuffer());
  if(buf[0]===0xFF&&buf[1]===0xFE)return new TextDecoder("utf-16le").decode(buf.subarray(2));
  if(buf[0]===0xFE&&buf[1]===0xFF)return new TextDecoder("utf-16be").decode(buf.subarray(2));
  if(buf.length>3&&buf[1]===0&&buf[3]===0&&buf[0]!==0)return new TextDecoder("utf-16le").decode(buf);
  try{return new TextDecoder("utf-8",{fatal:true}).decode(buf).replace(/^\uFEFF/,"")}catch(e){return new TextDecoder("windows-1252").decode(buf)}}
/* abre qualquer planilha (xlsx/xls/xlsm/csv/txt) e devolve o workbook */
async function svcReadWorkbook(f,opts){await ensureXLSX();
  if(/\.(csv|txt|tsv)$/i.test(f.name)){let t=await svcReadText(f);const first=(t.split(/\r?\n/).find(l=>l.trim())||"");
    if(first.includes("\t"))return XLSX.read(t,{type:"string",raw:true,FS:"\t",...(opts||{})});
    if(first.split(";").length>first.split(",").length)return XLSX.read(t,{type:"string",raw:true,FS:";",...(opts||{})});
    return XLSX.read(t,{type:"string",raw:true,...(opts||{})})}
  return XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:"array",...(opts||{})})}
/* ============ DADOS ============ */
const CARRIERS={
  AL:{n:"ALC",bg:"#111111",fg:"#ffffff"},
  EC:{n:"ECO EXPRESS",bg:"#f6e2c0",fg:"#1b1b1b"},
  MS:{n:"M.J SIMÕES",bg:"#8a8a8a",fg:"#ffffff"},
  HW:{n:"HAWK",bg:"#16357a",fg:"#ffffff"},
  ME:{n:"MELI EXTRA",bg:"#f4c7ad",fg:"#1b1b1b"},
  PL:{n:"PRALOG",bg:"#7b5ea7",fg:"#ffffff"},
  OT:{n:"ONTIME",bg:"#ffef2e",fg:"#1b1b1b"},
  PC:{n:"PARCEIRO",bg:"#ffffff",fg:"#1b1b1b"},
  KG:{n:"KANGU",bg:"#f39200",fg:"#1b1b1b"},
  DL:{n:"DELUNA",bg:"#4f7a2e",fg:"#ffffff"},
  CM:{n:"COOPMETRO",bg:"#22e024",fg:"#1b1b1b"},
  DC:{n:"DECARGO",bg:"#22e6ea",fg:"#1b1b1b"},
  PY:{n:"PY",bg:"#b8860b",fg:"#ffffff"},
  AV:{n:"AVTLOG",bg:"#0f766e",fg:"#ffffff"},
  VUC:{n:"VUC (todas)",bg:"#6d28d9",fg:"#ffffff"},
  X:{n:"Bloqueada",bg:"#e5262a",fg:"#ffffff"},
  V:{n:"Vazia",bg:"#e9ecef",fg:"#8a929b"}
};
function fill(o,a,b,code,s=1){if(a<=b){for(let i=a;i<=b;i+=s)o[i]=code}else{for(let i=a;i>=b;i-=s)o[i]=code}return o}
const build=steps=>{const o={};steps.forEach(st=>fill(o,...st));return o};
const LAYOUTS={
  "AM0-CHP":{map:build([[1,31,"X",2],[2,4,"AL",2],[6,8,"CM",2],[10,20,"KG",2],[22,26,"MS",2],[28,34,"X",2],
    [35,43,"HW"],[44,44,"X"],[45,49,"OT"],[50,50,"X"],[51,52,"DC"],[53,53,"X"],[54,54,"EC"],[55,55,"X"],[56,56,"DL"],[57,65,"X"],
    [88,76,"X"],[75,75,"DL"],[74,72,"EC"],[71,71,"OT"],[70,69,"PC"],[68,67,"HW"],[66,66,"CM"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"VUC",right:"VUC"}},
  "AM":{map:build([[1,31,"ME",2],[2,8,"PC",2],[10,22,"KG",2],[24,34,"ME",2],
    [35,38,"PC"],[39,45,"DL"],[46,49,"MS"],[50,54,"AL"],[55,60,"DC"],[61,65,"X"],
    [88,79,"HW"],[78,74,"CM"],[73,73,"PY"],[72,69,"EC"],[68,66,"OT"],[89,97,"X"]]),
    tags:{},veh:{top:"Passeio",bot:"Passeio",right:"VUC"}},
  "PM":{map:build([[1,9,"DC",2],[11,17,"MS",2],[19,23,"EC",2],[25,31,"CM",2],[2,4,"KG",2],[6,6,"PY"],[8,14,"OT",2],[16,22,"DL",2],[24,34,"PC",2],
    [35,39,"KG"],[40,65,"ME"],
    [88,83,"HW"],[82,81,"AL"],[80,77,"DL"],[76,76,"DC"],[75,75,"OT"],[74,74,"EC"],[73,72,"PC"],[71,66,"HW"],[89,97,"HW"]]),
    tags:{},veh:{top:"Passeio",bot:"Passeio",right:"VUC"}},
  "SD":{map:build([[1,31,"X",2],[2,6,"DC",2],[8,8,"EC"],[10,14,"OT",2],[16,20,"MS",2],[22,34,"HW",2],
    [35,37,"PC"],[38,40,"DL"],[41,42,"CM"],[43,50,"KG"],[51,65,"X"],[88,66,"X"],[89,97,"X"]]),
    tags:{},
    tagBelow:true,veh:{top:"Passeio",bot:"—",right:"VUC"}}
};
const rua=v=>v<=34?(v%2?1:2):v<=65?3:v<=88?5:4;
const area=v=>["","Rua 1 · coluna esquerda (ímpares)","Rua 2 · coluna esquerda (pares)","Rua 3 · ao lado da esteira","Rua 4 · lado direito (VUC)","Rua 5 · frente do mezanino (expedição VUC)"][rua(v)];
const vehOf=(L,v)=>v<=34?"—":v<=65?L.veh.top:v<=88?L.veh.bot:L.veh.right;
const SZ=36,STEP=42;
function pos(v){
  if(v<=34){const r=Math.floor((v-1)/2);return{x:v%2?40:86,y:98+r*STEP}}
  if(v<=65)return{x:128+(v-35)*STEP,y:56};
  if(v<=88)return{x:204+(88-v)*STEP,y:606};
  return{x:1320,y:250+(v-89)*STEP};
}
const BLOCKS_DEF={
  rampaS:{x:10,y:8,w:80,h:40,t:"RAMPA\nSAÍDA"},rampaU:{x:1300,y:130,w:98,h:40,t:"RAMPA ↑"},rampaU1:{x:1300,y:760,w:98,h:44,t:"RAMPA ↑ 1"},
  est1:{x:250,y:214,w:1000,h:24,t:"ESTEIRA"},est2:{x:250,y:296,w:1000,h:24,t:"ESTEIRA"},mez:{x:250,y:388,w:480,h:58,t:"MEZANINO"},
  exp:{x:190,y:592,w:986,h:66,t:"",dashed:true}};
const TAGS_DEF={1:{x:36,y:70},2:{x:84,y:70},3:{x:128,y:4},4:{x:1316,y:222},5:{x:204,y:578}};
const CAPS_DEF={3:{x:200,y:140},5:{x:204,y:684},4:{x:1250,y:636}};
// onde fica o nome da gaiola/rota em relação à vaga (x = centro do rótulo, ou esquerda se side)
const shortTag=t=>String(t||"").replace(/_[A-Z]{2,4}\d*$/i,"");
function tagPlace(v,below,len){const r=rua(v);const two=len>5&&v%2===0;
  if(r===3)return below?{cx:SZ/2,y:SZ+3+(two?17:0)}:{cx:SZ/2,y:two?-35:-18};
  if(r===5)return{cx:SZ/2,y:SZ+3+(two?17:0)};
  if(r===1)return{left:true,y:SZ/2-8};
  return{side:true,x:SZ+4,y:SZ/2-8}}
function mergeGeo(p){p=p||{};const slots={};for(let v=1;v<=97;v++)slots[v]=(p.slots&&p.slots[v])||pos(v);
  const blocks={};Object.keys(BLOCKS_DEF).forEach(k=>blocks[k]={...BLOCKS_DEF[k],...((p.blocks||{})[k]||{})});
  const tags={},caps={};[1,2,3,4,5].forEach(n=>{tags[n]=(p.tags||{})[n]||TAGS_DEF[n];if(CAPS_DEF[n])caps[n]=(p.caps||{})[n]||CAPS_DEF[n]});
  return {slots,blocks,tags,caps}}
function geoBounds(G){let W=0,H=0;Object.values(G.slots).forEach(p=>{W=Math.max(W,p.x+SZ);H=Math.max(H,p.y+SZ)});
  Object.values(G.blocks).forEach(b=>{W=Math.max(W,b.x+b.w);H=Math.max(H,b.y+b.h)});Object.values(G.caps).forEach(c=>{W=Math.max(W,c.x+150);H=Math.max(H,c.y+16)});
  return {W:Math.max(W+12,400),H:Math.max(H+16,300)}}
const capText=(L,n)=>n===3?"Rua 3 · "+L.veh.top+"   ←   sentido de saída":n===5?"Rua 5 · Expedição VUC"+(L.veh.bot&&L.veh.bot!=="—"?" · "+L.veh.bot:""):"Rua 4 · "+L.veh.right;
const allV=()=>{const m={};for(let v=1;v<=97;v++)m[v]="V";return m};
const EMPTY_MAP=allV();
const layoutVazio=L=>!Object.values(L.map).some(k=>k!=="V");
function groups(L){const g={};Object.entries(L.map).forEach(([v,k])=>(g[k]=g[k]||[]).push(+v));Object.values(g).forEach(a=>a.sort((x,y)=>x-y));return g}
function ranges(arr){const out=[];let i=0;while(i<arr.length){let j=i;const step=(arr[i]<=34&&arr[i+1]-arr[i]===2)?2:1;
  while(j+1<arr.length&&arr[j+1]-arr[j]===step&&(step===1||arr[j+1]<=34))j++;
  out.push(j>i?`${arr[i]}–${arr[j]}${step===2?" (ímpar/par)":""}`:`${arr[i]}`);i=j+1}return out.join(", ")}

/* ============ UI ============ */
const {useState,useEffect,useRef,useMemo}=React;
const {motion,AnimatePresence,LayoutGroup}=Motion;
const html=htm.bind(React.createElement);
const spring={type:"spring",stiffness:420,damping:32};
const tactile={};
const stagger={hidden:{},show:{transition:{staggerChildren:0,delayChildren:0}}};
const rise={hidden:{opacity:1,y:0},show:{opacity:1,y:0,transition:{duration:0}}};

function Swatch({k,size="sm"}){const c=CARRIERS[k];const cls=size==="lg"?"text-sm px-2.5 py-1 rounded-lg":"text-[10px] px-1.5 py-0.5 rounded-md";
  return html`<span class=${"font-mono font-bold inline-block "+cls} style=${{background:c.bg,color:c.fg,boxShadow:"inset 0 0 0 1px rgba(0,0,0,.25)"}}>${k}</span>`}

function Nav({cur,setCur}){
  return html`<header class="fixed top-0 inset-x-0 z-50" style=${{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <div class="glass !border-x-0 !border-t-0" style=${{background:"rgba(7,9,13,.62)"}}>
      <nav class="max-w-7xl mx-auto px-4 h-14 flex items-center gap-4">
        <div class="flex items-center gap-2 shrink-0">
          <span class="w-2 h-2 rounded-full" style=${{background:"var(--accent)",boxShadow:"0 0 12px var(--accent)"}}></span>
          <span class="font-display text-[13px] tracking-tight">SVC<span class="text-muted font-sans font-medium"> · Montar layout</span></span>
        </div>
        <${LayoutGroup} id="tabs">
          <div class="ml-auto flex gap-1 overflow-x-auto noscroll p-1 rounded-full" style=${{background:"rgba(255,255,255,.05)"}} role="tablist">
            ${Object.keys(LAYOUTS).map(k=>html`<${motion.button} key=${k} id=${"tab-"+k} role="tab" aria-selected=${k===cur} onClick=${()=>setCur(k)}
              class=${"relative shrink-0 px-3.5 sm:px-4 py-1.5 rounded-full text-[13px] font-medium transition-colors "+(k===cur?"text-black":"text-muted hover:text-ink")}>
              ${k===cur&&html`<${motion.span} layoutId="pill" class="absolute inset-0 rounded-full" style=${{background:"var(--ink)"}} transition=${spring}/>`}
              <span class="relative">${k}</span>
            </${motion.button}>`)}
          </div>
        </${LayoutGroup}>
      </nav>
    </div>
  </header>`;
}

function Card({className="",children,title,right}){
  return html`<${motion.section} variants=${rise} class=${"glass rounded-3xl p-4 sm:p-5 min-w-0 "+className}
      transition=${{duration:0}}>
    ${title&&html`<div class="flex items-center justify-between gap-3 mb-3"><h2 class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">${title}</h2>${right}</div>`}
    ${children}
  </${motion.section}>`;
}

function Skeleton(){
  const b=(c)=>html`<div class=${"glass rounded-3xl p-6 "+c}><div class="sk h-3 w-24 mb-5"></div><div class="sk h-8 w-2/3 mb-3"></div><div class="sk h-3 w-1/2"></div></div>`;
  return html`<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
    ${b("md:col-span-8 h-48")}${b("md:col-span-4 h-48")}
    <div class="glass rounded-3xl p-6 md:col-span-12"><div class="sk h-3 w-32 mb-5"></div><div class="sk w-full" style=${{height:"min(52vw,560px)"}}></div></div>
    ${b("md:col-span-7 h-72")}${b("md:col-span-5 h-72")}
  </div>`;
}

function Hero({cur,L,onClose}){
  const g=groups(L);const total=Object.keys(L.map).length-(g.V||[]).length;const bloq=(g.X||[]).length;
  const n=Object.keys(g).filter(k=>k!=="X"&&k!=="V").length;const vazio=layoutVazio(L);
  const stat=(v,l,color)=>html`<div class="min-w-0"><div class="font-display text-2xl sm:text-3xl tnum leading-none" style=${{color}}>${v}</div><div class="text-muted text-[11px] mt-1">${l}</div></div>`;
  return html`<${Card} className="md:col-span-8">
    <div class="flex items-center justify-between gap-2"><div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Layout do SVC</div>${onClose&&html`<button type="button" onClick=${onClose} class="text-xs text-muted hover:text-ink">Recolher</button>`}</div>
    <h1 class="font-display text-3xl sm:text-4xl tracking-tight mt-1 mb-3" style=${{textWrap:"balance"}}>
      <${AnimatePresence} mode="wait"><${motion.span} key=${cur} class="inline-block" initial=${{opacity:0,y:14}} animate=${{opacity:1,y:0}} exit=${{opacity:0,y:-14}} transition=${{duration:.3}}>${cur}</${motion.span}></${AnimatePresence}>
    </h1>
    ${vazio?html`<div class="rounded-xl px-3 py-2 text-xs max-w-lg" style=${{background:"rgba(255,181,71,.1)",color:"var(--amber)"}}>Nenhum layout ${cur} carregado neste navegador. Use <b>Ler desenho</b> no painel acima e mande o print do dia.</div>`:html`
    <div class="grid grid-cols-3 gap-4 max-w-md">
      ${stat(total-bloq,"vagas ativas","var(--ink)")}
      ${stat(bloq,"bloqueadas (X)","#ff6b6e")}
      ${stat(n,"transportadoras","var(--accent)")}
    </div>
    <div class="text-muted text-[11px] mt-2">${L.readAt?"Montado em "+L.readAt+" · para trocar, leia o desenho do dia ou use Limpar layout em Editar layout":""}</div>`}
  </${Card}>`;
}

function Search({L,onPick}){
  const [q,setQ]=useState("");const v=parseInt(q,10);const k=L.map[v];
  return html`<${Card} className="md:col-span-4" title="Buscar vaga">
    <label for="busca" class="sr-only">Número da vaga</label>
    <input id="busca" inputmode="numeric" value=${q} onInput=${e=>{setQ(e.target.value.replace(/\D/g,"").slice(0,2));const n=parseInt(e.target.value,10);if(L.map[n])onPick(n)}}
      placeholder="Ex.: 73" class="w-full bg-white/5 border border-line rounded-xl px-3 py-2 font-display text-xl tnum placeholder:text-white/20 outline-none focus:border-[var(--accent)] transition-colors"/>
    <div class="mt-2 min-h-[40px]">
      <${AnimatePresence} mode="wait">
        ${k?html`<${motion.div} key=${v+k} initial=${{opacity:0,scale:.96}} animate=${{opacity:1,scale:1}} exit=${{opacity:0}} class="flex items-center gap-3">
            <${Swatch} k=${k} size="lg"/>
            <div class="min-w-0"><div class="font-semibold">${CARRIERS[k].n}</div><div class="text-muted text-xs">${area(v)} · ${vehOf(L,v)}</div></div>
          </${motion.div}>`
        :html`<${motion.p} key="empty" initial=${{opacity:0}} animate=${{opacity:1}} class="text-muted text-sm">${q?"Essa vaga não existe neste layout.":"Digite o número (1 a 97) para ver a transportadora."}</${motion.p}>`}
      </${AnimatePresence}>
    </div>
  </${Card}>`;
}


/* Linha fina com o resumo do layout + busca (quando Layout do SVC / Buscar vaga estão recolhidos) */
function InfoStrip({cur,L,onPick,onOpen}){
  const g=groups(L);const total=Object.keys(L.map).length-(g.V||[]).length;const bloq=(g.X||[]).length;
  const n=Object.keys(g).filter(k=>k!=="X"&&k!=="V").length;const vazio=layoutVazio(L);
  const [q,setQ]=useState("");const v=parseInt(q,10);const k=L.map[v];
  return html`<${motion.section} variants=${rise} class="md:col-span-12 glass rounded-2xl px-3 py-2 flex flex-wrap items-center gap-x-4 gap-y-2 min-w-0">
    <button type="button" onClick=${onOpen} aria-expanded="false" class="flex items-center gap-2 text-left">
      <span class="text-muted text-xs">▶</span><span class="font-display text-lg leading-none">${cur}</span></button>
    ${vazio?html`<span class="text-xs" style=${{color:"var(--amber)"}}>Layout não lido · use Ler desenho</span>`

Quadrado vermelho, com ou sem "X", é X (bloqueada). Se a sigla não estiver legível, deduza pela cor. Se o número impresso estiver repetido ou errado, siga a sequência da rua. Na coluna VUC pode haver uma célula amarela "VUC" ao lado: a sigla é a do quadrado da vaga.
Perto de algumas vagas (em cima, embaixo ou ao lado) pode estar escrito o nome da gaiola/rota, ex.: VG7_CHP, A13_SD, VC1, A14. Copie exatamente como está escrito. Ignore "Passeio", "VUC" isolado, setas, "ESTEIRA", "MEZANINO", "RAMPA".
Responda SOMENTE com um JSON neste formato:
{"titulo":"título do desenho, se houver","ciclo":"AM" | "PM" | "SD" | "AM0-CHP" | null,"vagas":{"1":"X","2":"DC","35":"PC"},"gaiolas":{"2":"A13_SD","35":"A14"},"duvidas":[11,46]}
Em "vagas" coloque todas as vagas que aparecem no desenho. Em "duvidas" os números das vagas que você não conseguiu ler com certeza.`;

function detectLayoutCycleFromDrawing(vagas){
  const keys=Object.keys(LAYOUTS), scores=[];
  for(const key of keys){
    const ref=LAYOUTS[key].map||{};let hit=0,total=0,strong=0;
    for(const [vv,kk] of Object.entries(vagas||{})){
      const v=+vv,r=ref[v];if(!r||!kk||kk==="V")continue;
      total++;
      if(r===kk){hit++;if(kk!=="X")strong++}
    }
    scores.push({key,hit,total,strong,pct:total?hit/total:0});
  }
  scores.sort((a,b)=>b.pct-a.pct||b.strong-a.strong||b.hit-a.hit);
  const best=scores[0],second=scores[1];
  if(!best||best.total<20)return null;
  const margin=second?best.pct-second.pct:best.pct;
  return (best.pct>=0.62 && (margin>=0.06 || best.pct>=0.82))?best.key:null;
}

function distributeRoutes(map,tags){
  const res={...tags};const used=new Set(Object.values(res).filter(Boolean));const byK={};
  planGaiolas().forEach(r=>{if(!used.has(r.g)){(byK[r.k]=byK[r.k]||[]).push(r);used.add(r.g)}});
  let placed=0,left=0;const order=v=>rua(v)===5?1000-v:v;
  Object.keys(byK).forEach(k=>{byK[k].sort((a,b)=>(a.onda||9)-(b.onda||9)||a.g.localeCompare(b.g,"pt",{numeric:true}));
    const vs=Object.keys(map).map(Number).filter(v=>map[v]===k&&!res[v]).sort((a,b)=>rua(a)-rua(b)||order(a)-order(b));
    byK[k].forEach((r,i)=>{if(vs[i]){res[vs[i]]=r.g;placed++}else left++})});
  return {tags:res,placed,left};
}

/* ============ PLANEJAMENTO ============ */
const normTxt=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\s+/g," ").trim();

  {id:"transp",label:"Transportadora",re:/TRANSP|CARRIER|EMPRESA|SIGLA|MLP/},
  {id:"onda",label:"Onda",re:/ONDA|WAVE/},
  {id:"parada",label:"Paradas",re:/^PARADAS?$|STOP/},
  {id:"pacotes",label:"Pacotes",re:/^SPR$|^PACOTES?$|^SHIPMENTS?$/},

function guessMap(headers){const m={};const used=new Set();

// cabeçalho quebrado (ex.: "F15_AM" no lugar de GAIOLA): acha a coluna pelo conteúdo (A13_AM1, VG4_AM1, SACA)
function fixMapByContent(m,headers,rows){if(m.gaiola)return m;const used=new Set(Object.values(m));const smp=rows.slice(0,200);

    return v.length>=5&&v.filter(x=>/^SACA$/i.test(x)||/^[A-Z]{1,3}\d+_[A-Z]{2,4}\d*$/i.test(x)).length/v.length>=.6});

// acha a linha de cabeçalho (a planilha pode ter título em cima)
// planilha sem cabeçalho: descobre cada coluna pelo conteúdo
function inferHeaders(aoa){
  const data=aoa.filter(r=>r.some(c=>c));if(!data.length)return null;const n=Math.max(...data.map(r=>r.length));const smp=data.slice(0,80);
  const tests={transp:v=>!!matchCarrier(v)||/^ESVAZIAR$/i.test(v),data:v=>/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(v),
    rota:v=>/^[A-Z]{2,4}\d*_\d+(_\d+)*$/i.test(v),gaiola:v=>/^SACA$/i.test(v)||/^[A-Z]{1,3}\d+_[A-Z]{2,4}\d*$/i.test(v),
    onda:v=>/^(ONDA\s*\d+|SEM ONDA)$/i.test(v),parada:v=>/^\d{1,4}$/.test(v)};

  for(let i=0;i<n;i++){let bestK=null,bestR=0;Object.keys(tests).forEach(k=>{if(used.has(k))return;const vals=smp.map(r=>r[i]||"").filter(Boolean);if(!vals.length)return;
      const r=vals.filter(tests[k]).length/vals.length;if(r>bestR){bestR=r;bestK=k}});
    if(bestK&&bestR>=.6){used.add(bestK);headers.push(names[bestK])}else headers.push("Coluna "+(i+1))}

function fromAOA(aoa){

  aoa.slice(0,20).forEach((r,i)=>{const sc=r.filter(c=>c&&FIELDS.some(f=>f.re.test(normTxt(c)))).length;if(sc>best){best=sc;hi=i}});

function detectCiclo(title,rows,m){

function planDD(v){const t=String(v??"").trim();let m=t.match(/^(\d{1,2})\/(\d{1,2})(\/\d{2,4})?$/);if(m)return m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0");

      transpRaw:String(r0[m.transp]??"").trim(),k:matchCarrier(r0[m.transp]),onda:m.onda?ondaNum(r0[m.onda]):null,

/* ============ CALCULADORA DE ONDAS ============ */
/* Divide as rotas de cada transportadora em N ondas.
   Híbrida = rota mãe (gaiola) + sacas filhas (gaiola "SACA", rota CPM_x_y): o bloco inteiro fica na MESMA onda. */
function svcReadPlan(){try{const s=JSON.parse(localStorage.getItem("svc-plan2")||"null");return s&&s.rows?s:null}catch(e){return null}}
function svcStorePlan(obj){try{localStorage.setItem("svc-plan2",JSON.stringify(obj))}catch(e){}svcSavePlanRemote(obj);window.dispatchEvent(new CustomEvent("svc-plan-remote",{detail:obj}))}
async function svcImportPlanFile(f){const wb=await svcReadWorkbook(f,{});let best=null;
  wb.SheetNames.forEach(n=>{const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:""});const t=fromAOA(aoa);const g=guessMap(t.headers);
    const g2=fixMapByContent(g,t.headers,t.rows);const sc=(g2.rota?2:0)+(g2.gaiola?2:0)+(g2.onda?1:0)+t.rows.length/1e6;if(!best||sc>best.sc)best={t,g:g2,sc}});
  if(!best||!best.t.rows.length)throw {code:"empty"};
  if(!((best.g.rota||best.g.gaiola)&&best.g.transp))throw {code:"cols"};
  const obj={...best.t,name:f.name,at:new Date().toLocaleString("pt-BR"),map:best.g,savedAt:Date.now()};svcStorePlan(obj);return obj}
// colunas que parecem de transportadora (ex.: MLP e SUGESTÃO)
function carrierCols(src){const rs=(src.rows||[]).slice(0,250);return (src.headers||[]).filter(h=>{const vals=rs.map(r=>String(r[h]||"").trim()).filter(Boolean);
  return vals.length>=5&&vals.filter(v=>matchCarrier(v)).length/vals.length>=.5&&vals.filter(v=>/[_\/]/.test(v)).length/vals.length<.2})}
// sufixo das gaiolas (ex.: CPM em A3_CPM) para o título do resumo
function planTag(src){const c={};(src.rows||[]).forEach(r=>{const x=String(r[(src.map||{}).gaiola]||"").trim().match(/_([A-Z]{2,4}\d*)$/i);if(x){const t=x[1].toUpperCase();c[t]=(c[t]||0)+1}});
  const b=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];return b&&b[1]>=3?b[0]:""}
// VUC: por enquanto só no PM. É VUC quando a coluna MODAL diz VUC (Vuc, VUC Dedicado, VUC PP...).
// No PM, todas as gaiolas VUC vão para a Rua 4, que vira uma área compartilhada (vaga de qualquer transportadora).
const VUC_CAP=9;
const svcIsVuc=modal=>/(^|[^A-Z])VUC([^A-Z]|$)/.test(normTxt(modal));
function svcVucCiclo(src){return !!src&&detectCiclo(src.title||"",src.rows||[],src.map||{})==="PM"}
function ondaUnits(src,col){const m={...(src.map||{})};if(col)m.transp=col;if(!(m.rota||m.gaiola)||!m.transp)return {units:[],skip:[]};
  const units=[],skip=[];const nm=v=>{const x=parseFloat(String(v??"").replace(",","."));return isFinite(x)?x:0};const pmV=svcVucCiclo(src);
  aggregate(src.rows,m).forEach(i=>{const isSaca=normTxt(i.gaiola)==="SACA";
    const u={key:i.key,rota:i.rota||i.key,gaiola:isSaca?"":i.gaiola,k:i.k,raw:i.transpRaw,par:nm(i.parada),pac:i.pac||0,modal:i.modal,orfa:isSaca,po:i.onda||null,
      sacas:i.children.map(c=>({key:c.key,rota:c.rota||c.key,par:nm(c.parada),pac:c.pac||0,modal:c.modal,raw:c.transpRaw,po:c.onda||null}))};
    // saca com onda diferente da mãe = conflito no planejamento
    u.conf=u.sacas.filter(c=>c.po&&u.po&&c.po!==u.po).map(c=>c.rota);
    u.hib=u.sacas.length>0||i.sacaIds.length>0;u.vuc=pmV&&svcIsVuc(i.modal);(u.k?units:skip).push(u)});
  return {units,skip}}
const ONDA_W={rotas:u=>1+u.sacas.length,gaiolas:()=>1,pacotes:u=>Math.max(1,u.pac+u.sacas.reduce((s,c)=>s+c.pac,0)),paradas:u=>Math.max(1,u.par+u.sacas.reduce((s,c)=>s+c.par,0))};
const ONDA_COR=["#4cc3ff","#ffb547","#5ee6b0","#c084fc","#ff8a8c","#facc15","#38bdf8","#fb7185","#a3e635","#f472b6"];
const byRota=(a,b)=>a.rota.localeCompare(b.rota,"pt",{numeric:true});
function calcOndas(units,n,mode,hib,ord,fix,usePlan,allowed,vcap){const wf=ONDA_W[mode]||ONDA_W.rotas;const res={};const glob=Array(n).fill(0);const byK={};const AK={};
  units.forEach(u=>(byK[u.k]=byK[u.k]||[]).push(u));const tot=k=>byK[k].reduce((s,u)=>s+wf(u),0);
  Object.keys(byK).sort((a,b)=>tot(b)-tot(a)).forEach(k=>{const load=Array(n).fill(0),cnt=Array(n).fill(0);
    let A=((allowed&&allowed[k])||[]).filter(w=>w>=0&&w<n).sort((a,b)=>a-b);if(!A.length)A=[...Array(n).keys()];AK[k]=A;
    const put=(u,w)=>{res[u.key]=w;load[w]+=wf(u);cnt[w]++;glob[w]+=wf(u)};
    const free=[];byK[k].slice().sort(byRota).forEach(u=>{const f=fix[u.key];
      if(f!=null&&f<n)put(u,f);else if(usePlan&&u.po&&u.po<=n)put(u,u.po-1);else if(u.hib&&hib==="first")put(u,A[0]);else if(u.hib&&hib==="last")put(u,A[A.length-1]);else free.push(u)});
    // meta de cada onda = parte inteira da divisão; a sobra é repartida (+1) nas ÚLTIMAS ondas da transportadora
    const TT=tot(k),base=Math.floor(TT/A.length),sobra=TT-base*A.length;const tgt={};A.forEach((w,i)=>tgt[w]=base+(i>=A.length-sobra?1:0));
    if(ord==="seq"){let ai=0;free.forEach(u=>{const x=wf(u);while(ai<A.length-1&&load[A[ai]]+x>tgt[A[ai]])ai++;put(u,A[ai])})}
    else free.sort((a,b)=>wf(b)-wf(a)||byRota(a,b)).forEach(u=>{let b=A[0];for(const w of A){const fw=tgt[w]-load[w],fb=tgt[b]-load[b];
      if(fw>fb||(fw===fb&&(cnt[w]<cnt[b]||(cnt[w]===cnt[b]&&glob[w]<glob[b]))))b=w}put(u,b)})});
  // Rua 4 (VUC) tem vcap vagas: onda com VUC demais empurra o excesso para a onda seguinte da mesma transportadora
  // (troca com uma gaiola comum dela, para a divisão continuar justa). Sem onda seguinte, tenta uma anterior.
  if(vcap>0){const vc=Array(n).fill(0);units.forEach(u=>{if(u.vuc&&res[u.key]!=null)vc[res[u.key]]++});
    for(let w=0;w<n;w++){let guard=0;while(vc[w]>vcap&&guard++<500){
      const cand=units.filter(u=>u.vuc&&res[u.key]===w&&fix[u.key]==null).sort((a,b)=>byRota(b,a));let moved=false;
      for(const u of cand){const A=AK[u.k]||[];const opts=[...A.filter(x=>x>w),...A.filter(x=>x<w).reverse()].filter(x=>vc[x]<vcap);if(!opts.length)continue;const w2=opts[0];
        const sw=units.find(x=>x.k===u.k&&!x.vuc&&res[x.key]===w2&&fix[x.key]==null&&wf(x)===wf(u));
        res[u.key]=w2;vc[w]--;vc[w2]++;if(sw)res[sw.key]=w;moved=true;break}
      if(!moved)break}}}
  return res}

function OndasCalc({cur,L,onRedistribute}){

  const stampP=src?String(src.savedAt||src.at||""):"";

  useEffect(()=>{if(!msg)return;const t=setTimeout(()=>setMsg(""),5000);return()=>clearTimeout(t)},[msg]);

  const col=src&&cfg.col&&(src.headers||[]).includes(cfg.col)?cfg.col:((src&&src.map&&src.map.transp)||"");

  const planMax=units.reduce((a,u)=>Math.max(a,u.po||0),0);const nPlan=units.filter(u=>u.po).length;

  const [alwAll,setAlwAll]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-ondas-alw")||"{}")||{}}catch(e){return {}}});

  const setAlwOv=o=>{const x={stamp:stampP+"|"+pm,ov:o};setAlwAll(x);try{localStorage.setItem("svc-ondas-alw",JSON.stringify(x))}catch(e){}};
  const alwBase=useMemo(()=>{const o={};if(pm==="div")units.forEach(u=>{if(u.po){(o[u.k]=o[u.k]||new Set()).add(u.po-1);u.sacas.forEach(c=>{if(c.po)o[u.k].add(c.po-1)})}});
    const r={};Object.keys(o).forEach(k=>r[k]=[...o[k]].sort((a,b)=>a-b));return r},[units,pm]);
  const allowed=useMemo(()=>{const r={...alwBase};Object.keys(alwOv).forEach(k=>{if(alwOv[k]&&alwOv[k].length)r[k]=alwOv[k]});return r},[alwBase,alwAll,stampP,pm]);
  const alwOf=k=>{const a=(allowed[k]||[]).filter(w=>w<n);return a.length?a:[...Array(n).keys()]};

  const res=useMemo(()=>calcOndas(units,n,cfg.mode,cfg.hib,cfg.ord,fix,usePlan,usePlan?null:allowed,VUC_CAP),[units,n,cfg.mode,cfg.hib,cfg.ord,fixAll,stampP,usePlan,allowed]);
  const semOnda=usePlan?units.filter(u=>!u.po):[];const conf=units.filter(u=>u.conf&&u.conf.length);
  const st=useMemo(()=>{const z=()=>({r:0,g:0,h:0,p:0,s:0,k:0});const waves=[...Array(n)].map(z);const byK={};

  const T=st.waves.reduce((a,s)=>({r:a.r+s.r,g:a.g+s.g,h:a.h+s.h,s:a.s+s.s,k:a.k+s.k}),{r:0,g:0,h:0,s:0,k:0});

  const btn="text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap";

/* ============ OCUPAÇÃO GRADUAL: vagas físicas são reutilizadas onda a onda ============ */
function svcWaveQueue(src){
  if(!src||!src.rows||!src.ondaCalc)return [];
  const m=src.map||{};
  if(!(m.rota||m.gaiola)||!m.transp)return [];
  const seen=new Set();const pmV=svcVucCiclo(src);
  return aggregate(src.rows,m).map((r,i)=>{
    const g=String(r.gaiola&&normTxt(r.gaiola)!=="SACA"?r.gaiola:r.rota||"").trim();
    const w=Number(src.ondaCalc[r.key]||r.onda||0);
    // k = quem usa a vaga ("VUC" na Rua 4 compartilhada); kr = transportadora de verdade
    const vuc=pmV&&!!r.k&&svcIsVuc(r.modal);
    return {g,k:vuc?"VUC":r.k,kr:r.k,vuc,w,order:i,ruas:vuc?null:(r.ruasFix||null)};
  }).filter(r=>{if(!r.g||!r.k||!r.w||seen.has(r.g))return false;seen.add(r.g);return true})
    .sort((a,b)=>a.w-b.w||a.order-b.order);
}
const svcQNome=q=>q.vuc?"VUC · "+(CARRIERS[q.kr]?CARRIERS[q.kr].n:q.kr):(CARRIERS[q.k]?CARRIERS[q.k].n:q.k);
function svcOccupationKey(src,cur){return String(src.savedAt||src.at||src.name||"")+"|"+cur}
/* VISÃO DE EXPEDIÇÃO: plano de ocupação projetado, não telemetria dos motoristas. */
function svcPlanSlots(queue,map,tags,done){
  const completed=new Set(done||[]),placed=new Set();
  const slots=Object.keys(map||{}).map(Number).filter(v=>CARRIERS[map[v]]&&map[v]!=="X"&&map[v]!=="V").sort((a,b)=>rua(a)-rua(b)||a-b);
  const out={};slots.forEach(v=>out[v]=[]);
  // A primeira ocupação segue o layout aprovado ou a antecipação manual.
  for(const v of slots){const g=tags&&tags[v],q=queue.find(x=>x.g===g);if(q&&!completed.has(q.g)&&q.k===map[v]){out[v].push(q);placed.add(q.g)}}
  const pending=queue.filter(q=>!completed.has(q.g)&&!placed.has(q.g));
  for(const q of pending){
    const vs=slots.filter(v=>map[v]===q.k&&(!q.ruas||q.ruas.includes(rua(v))));
    if(!vs.length)continue;
    vs.sort((a,b)=>out[a].length-out[b].length||rua(a)-rua(b)||a-b);
    out[vs[0]].push(q);placed.add(q.g);
  }
  return {out,unplaced:queue.filter(q=>!completed.has(q.g)&&!placed.has(q.g))};
}
function svcCopyText(t){return navigator.clipboard.writeText(t)}
/* 1ª ocupação: gaiolas da 1ª onda de cada transportadora nas vagas dela.
   Sobrou vaga da transportadora? Já deixa SUGERIDAS as gaiolas da onda seguinte dela. */
function svcFirstFill(queue,map,tags){tags={...tags};const sug=[];let placed=0;
  const waves={};queue.forEach(q=>{(waves[q.k]=waves[q.k]||new Set()).add(q.w)});
  const ord={};Object.keys(waves).forEach(k=>ord[k]=[...waves[k]].sort((a,b)=>a-b));
  const slotsOf=q=>Object.keys(map).map(Number).filter(v=>map[v]===q.k&&!tags[v]&&(!q.ruas||q.ruas.includes(rua(v)))).sort((a,b)=>rua(a)-rua(b)||a-b);
  [0,1].forEach(step=>queue.forEach(q=>{if(q.w!==ord[q.k][step])return;const vs=slotsOf(q);if(vs.length){tags[vs[0]]=q.g;placed++;if(step)sug.push(q.g)}}));
  return {tags,placed,sug}}
function svcSugSet(c){try{const o=JSON.parse(localStorage.getItem("svc-occupation-v1")||"{}")||{};return new Set((o[c]&&o[c].sug)||[])}catch(e){return new Set()}}

/* ============ MONTAR VAGAS AUTOMATICAMENTE ============
   Vaga reaproveitada onda a onda: cada transportadora precisa, no mínimo, das vagas da sua MAIOR onda (pico).
   Sobrando vaga, o resto é repartido pelo total de gaiolas (menos troca na vaga). Faltando, divide pelo pico.
   Posição: mantém cada transportadora onde ela já está no layout (desenho lido ou padrão do ciclo) e cresce
   para as vagas livres mais próximas. Vaga bloqueada (X) continua bloqueada. */
const SVC_VAGAS=[...LR_NUMS[1],...LR_NUMS[2],...LR_NUMS[3],...LR_NUMS[5],...LR_NUMS[4]];
function svcNeed(queue){const by={};queue.forEach(q=>{const o=by[q.k]=by[q.k]||{tot:0,w:{}};o.tot++;o.w[q.w]=(o.w[q.w]||0)+1});
  Object.values(by).forEach(o=>{o.peak=Math.max(...Object.values(o.w));o.peakW=+Object.keys(o.w).find(w=>o.w[w]===o.peak)});return by}
function svcSplit(ks,weight,total){const W=ks.reduce((a,k)=>a+weight(k),0)||1;const r={};let used=0;
  const fr=ks.map(k=>{const x=total*weight(k)/W;r[k]=Math.floor(x);used+=r[k];return [k,x-r[k]]}).sort((a,b)=>b[1]-a[1]);
  for(let i=0;used<total&&i<fr.length;i++,used++)r[fr[i][0]]++;return r}
function svcAutoVagas(base,queue){
  const need=svcNeed(queue);const ks=Object.keys(need);
  const act=v=>!(base[v]==="X");
  // caminho das vagas, em "S" para os blocos continuarem colados: Rua 1 desce, Rua 2 sobe, Rua 3 vai para a direita,
  // depois Rua 5 (da direita para a esquerda) e Rua 4 (VUC) por último
  const PATH={1:LR_NUMS[1],2:[...LR_NUMS[2]].reverse(),3:LR_NUMS[3],5:[...LR_NUMS[5]].reverse(),4:LR_NUMS[4]};
  const cap={};[1,2,3,5,4].forEach(r=>cap[r]=PATH[r].filter(act).length);
  const sumPeak=ks.filter(k=>k!=="VUC").reduce((a,k)=>a+need[k].peak,0);
  // MELI EXTRA: SÓ na Rua 3, do fim (65) para o começo, deixando as 3 primeiras vagas da rua (35–37)
  // para uma transportadora pequena — igual ao layout do dia a dia. O resto das gaiolas dela espera na fila.
  // VUC (PM): a Rua 4 inteira vira área compartilhada de VUC e sai da conta das outras ruas
  const hasVuc=!!need.VUC;const PATHS=hasVuc?[1,2,3,5]:[1,2,3,5,4];
  const ME_FOLGA=3;const others=ks.filter(k=>k!=="ME"&&k!=="VUC");const meCap=need.ME?Math.max(0,cap[3]-ME_FOLGA):0;
  let meN=need.ME?Math.min(meCap,need.ME.peak):0;
  const sumO=others.reduce((a,k)=>a+need[k].peak,0);
  // usa as ruas 1, 2 e 3; só abre a 5 e depois a 4 se não couber
  const ruas=[1,2,3];for(const r of PATHS.slice(3)){if(sumO+meN<=ruas.reduce((a,x)=>a+cap[x],0))break;ruas.push(r)}
  const S=ruas.reduce((a,r)=>a+cap[r],0);let restS=S-meN;
  const tgt={};
  if(sumO<=restS){let ex=restS-sumO;

      </div>`}
      ${tentative.unplaced.length>0&&html`<p class="text-xs" style=${{color:"var(--amber)"}}>Sem vaga compatível: ${tentative.unplaced.slice(0,20).map(q=>q.g+" (O"+q.w+")").join(" · ")}${tentative.unplaced.length>20?" · ...":""}</p>`}
      ${active&&html`<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">${occupied.map(([v,t])=>{const q=queue.find(x=>x.g===t);return html`<div key=${v} class="rounded-xl p-2 border border-white/10 bg-white/[.04] flex flex-col gap-1"><span class="text-[10px] text-muted">Vaga ${v} · ${CARRIERS[L.map[v]]?.n||L.map[v]}</span><b class="font-mono text-xs break-all">${shortTag(t)}</b><span class="text-[10px]" style=${{color:q?ONDA_COR[(q.w-1)%10]:"var(--muted)"}}>${q?"Onda "+q.w:"Manual"}</span><button type="button" disabled=${!q} onClick=${()=>{const next=onRelease(+v);setMsg(next?(next.passou?`Vaga ${v} liberada. A transportadora acabou as rotas: a vaga passou para ${CARRIERS[next.passou].n} · ${next.g} (onda ${next.w}).`:`Vaga ${v} liberada. Próxima: ${next.g} (onda ${next.w}).`):`Vaga ${v} liberada; sem outra gaiola pendente nela nem nas vizinhas.`)}} class="mt-1 rounded-lg text-[11px] py-1.5 font-semibold disabled:opacity-30" style=${{background:"rgba(94,230,176,.17)",color:"#5ee6b0"}}>Liberar vaga ${v}</button></div>`})}</div>`}
      ${active&&remaining.length>0&&html`<p class="text-xs" style=${{color:"var(--amber)"}}>Aguardando vaga: ${remaining.slice(0,12).map(q=>`${q.g} (O${q.w}, ${svcQNome(q)})`).join(" · ")}${remaining.length>12?` · +${remaining.length-12} outras`:""}</p>`}
      ${active&&html`<p class="text-[11px] text-muted">As vagas sem gaiola na fila ficam livres. As rotas concluídas não retornam automaticamente ao layout. Dados salvos neste navegador.</p>`}
    </div>`}
  </${Card}>`;
}

function App(){
  let init="AM0-CHP";try{const s=localStorage.getItem("svc-tab");if(s&&LAYOUTS[s])init=s}catch(e){}
  const [cur,setCurRaw]=useState(init);const [filter,setFilter]=useState(null);const [sel,setSel]=useState(null);
  const PAGES=[{id:"layout",label:"Layout",icon:"▦",desc:"Mapa das vagas"},{id:"ondas",label:"Calculadora",icon:"≋",desc:"Divisão das ondas"},{id:"expedicao",label:"Expedição",icon:"⇄",desc:"Rotas por vaga"},{id:"importar",label:"Planejamento",icon:"▤",desc:"Importação e leitura"}];
  const [page,setPageRaw]=useState(()=>{try{const x=localStorage.getItem("svc-page");return PAGES.some(p=>p.id===x)?x:"layout"}catch(e){return "layout"}});
  const setPage=x=>{setPageRaw(x);try{localStorage.setItem("svc-page",x)}catch(e){}};
  const setCur=k=>{if(k===cur)return;setCurRaw(k);setFilter(null);setSel(null);try{localStorage.setItem("svc-tab",k)}catch(e){}};
  const RA0=(()=>{try{return JSON.parse(localStorage.getItem("svc-read-at")||"{}")||{}}catch(e){return {}}})();
  const semData=(key)=>{try{const o=JSON.parse(localStorage.getItem(key)||"{}")||{};const n={};Object.keys(o).forEach(k=>{if(RA0[k])n[k]=o[k]});localStorage.setItem(key,JSON.stringify(n));return n}catch(e){return {}}};
  const [edits,setEdits]=useState(()=>semData("svc-edits"));
  const [hist,setHist]=useState({});
  const [respAll,setRespAll]=useState(()=>getRespAll());
  const [readAt,setReadAt]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-read-at")||"{}")}catch(e){return {}}});
  const storeReadAt=o=>{setReadAt(o);try{localStorage.setItem("svc-read-at",JSON.stringify(o))}catch(e){}svcPatchRemote({readAt:o})};
  const [geos,setGeos]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-geo9")||"{}")}catch(e){return {}}});
  const [tagOv,setTagOv]=useState(()=>semData("svc-tags"));
  const [occupation,setOccupation]=useState(()=>{try{return JSON.parse(localStorage.getItem("svc-occupation-v1")||"{}")||{}}catch(e){return {}}});
  const saveOccupation=o=>{setOccupation(o);try{localStorage.setItem("svc-occupation-v1",JSON.stringify(o))}catch(e){}};
  const sourceNow=()=>svcReadPlan();
  const occCurrent=()=>{const src=sourceNow();const st=occupation[cur];return src&&st&&st.key===svcOccupationKey(src,cur)?st:null};
  const beginOccupation=()=>{
    const src=sourceNow();const queue=svcWaveQueue(src);if(!queue.length)return;
    const map=layoutVazio(L)?{...LAYOUTS[cur].map}:L.map;
    const names=new Set(queue.map(q=>q.g));const tags={};
    Object.entries(L.tags).forEach(([v,t])=>{if(t&&!names.has(t))tags[v]=t});
    const done=[];
    const ff=svcFirstFill(queue,map,tags);
    if(layoutVazio(L))storeEdits({...edits,[cur]:map});
    storeTags({...tagOv,[cur]:ff.tags});stamp();
    saveOccupation({...occupation,[cur]:{key:svcOccupationKey(src,cur),tags:ff.tags,done,sug:ff.sug}});
  };
  const promoteOccupied=(v,g)=>{
    const src=sourceNow(),st=occCurrent();if(!src||!st||!g)return;
    const q=svcWaveQueue(src).find(x=>x.g===g);
    if(!q||q.k!==L.map[v]||(q.ruas&&!q.ruas.includes(rua(v)))||(st.done||[]).includes(g))return;
    if(Object.entries(st.tags).some(([other,t])=>+other!==v&&t===g))return;
    const tags={...st.tags,[v]:g};
    storeTags({...tagOv,[cur]:tags});saveOccupation({...occupation,[cur]:{...st,tags}});
  };
  const releaseOccupied=v=>{
    const src=sourceNow(),st=occCurrent();if(!src||!st||!st.tags[v])return null;
    const queue=svcWaveQueue(src),old=st.tags[v],completed=queue.find(q=>q.g===old);
    if(!completed)return null;
    const done=[...new Set([...(st.done||[]),old])];const tags={...st.tags};delete tags[v];const sugL=(st.sug||[]).filter(g=>g!==old);
    const active=new Set(Object.values(tags).filter(Boolean));
    const free=q=>!active.has(q.g)&&!done.includes(q.g)&&(!q.ruas||q.ruas.includes(rua(v)));
    let next=queue.find(q=>q.k===L.map[v]&&free(q));let passou=null;
    if(!next&&L.map[v]!=="VUC"){// a transportadora acabou: a vaga passa para a vizinha que ainda tem gaiola na fila (a com mais fila)
      const pv=pos(v);const viz=[...new Set(Object.keys(L.map).map(Number).filter(u=>u!==v&&CARRIERS[L.map[u]]&&L.map[u]!=="X"&&L.map[u]!=="V"&&L.map[u]!==L.map[v]&&Math.hypot(pos(u).x-pv.x,pos(u).y-pv.y)<=STEP*1.25).map(u=>L.map[u]))];
      const pend=k=>queue.filter(q=>q.k===k&&free(q)).length;const kk=viz.filter(k=>pend(k)>0&&k!=="VUC"&&(k!=="ME"||rua(v)===3)).sort((a,b)=>pend(b)-pend(a))[0];
      if(kk){next=queue.find(q=>q.k===kk&&free(q));passou=kk;storeEdits({...edits,[cur]:{...L.map,[v]:kk}})}}
    if(next)tags[v]=next.g;
    storeTags({...tagOv,[cur]:tags});saveOccupation({...occupation,[cur]:{...st,tags,done,sug:sugL}});
    return next?{...next,passou}:null;
  };

  const storeTags=o=>{setTagOv(o);try{localStorage.setItem("svc-tags",JSON.stringify(o))}catch(e){}svcPatchRemote({tagOv:o})};
  const stamp=()=>{if(!readAt[cur])storeReadAt({...readAt,[cur]:new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})})};
  const onTag=(v,t)=>{stamp();const cur2={...(tagOv[cur]||{}),[v]:t};storeTags({...tagOv,[cur]:cur2})};
  const storeGeos=o=>{setGeos(o);try{localStorage.setItem("svc-geo9",JSON.stringify(o))}catch(e){}svcPatchRemote({geos:o})};
  const storeEdits=o=>{setEdits(o);try{localStorage.setItem("svc-edits",JSON.stringify(o))}catch(e){}svcPatchRemote({edits:o})};
  const layoutOf=k=>({...LAYOUTS[k],key:k,map:edits[k]||EMPTY_MAP,tags:{},readAt:readAt[k]||null,geo:mergeGeo(geos[k]),tags:(()=>{const t={};Object.entries(tagOv[k]||{}).forEach(([v,x])=>{if(x)t[v]=x;else delete t[v]});return t})()});
  const L=useMemo(()=>layoutOf(cur),[cur,edits,geos,tagOv,readAt]);
  const snap=()=>({map:L.map,geo:geos[cur]||null,tags:tagOv[cur]||null});
  const pushHist=()=>setHist(h=>({...h,[cur]:[...(h[cur]||[]),snap()].slice(-60)}));
  const onGeo=patch=>{pushHist();const g=geos[cur]||{};const ng={...g};["slots","blocks","tags","caps"].forEach(k=>{if(patch[k])ng[k]={...(g[k]||{}),...patch[k]}});storeGeos({...geos,[cur]:ng})};
  const onEdit=nm=>{pushHist();stamp();storeEdits({...edits,[cur]:nm})};
  const onUndo=()=>{const st=hist[cur]||[];if(!st.length)return;const prev=st[st.length-1];setHist({...hist,[cur]:st.slice(0,-1)});
    const ne={...edits};if(layoutVazio({map:prev.map}))delete ne[cur];else ne[cur]=prev.map;storeEdits(ne);
    const ng={...geos};if(prev.geo)ng[cur]=prev.geo;else delete ng[cur];storeGeos(ng);
    const nt={...tagOv};if(prev.tags)nt[cur]=prev.tags;else delete nt[cur];storeTags(nt)};
  
  const onZero=()=>{pushHist();const ne={...edits};delete ne[cur];storeEdits(ne);storeTags({...tagOv,[cur]:{}});const nr={...readAt};delete nr[cur];storeReadAt(nr)};
  const onDistribute=()=>{pushHist();stamp();const r=distributeRoutes(L.map,L.tags);storeTags({...tagOv,[cur]:r.tags});return r};
  // layout automático: quando as ondas do planejamento mudam, recoloca as gaiolas do planejamento nas vagas (onda 1 primeiro).
  // Nomes escritos à mão que não são do planejamento ficam onde estão.
  const [planVer,setPlanVer]=useState(0);
  useEffect(()=>{const f=()=>setPlanVer(v=>v+1);window.addEventListener("svc-plan-remote",f);return()=>window.removeEventListener("svc-plan-remote",f)},[]);
  const [autoMsg,setAutoMsg]=useState("");useEffect(()=>{if(!autoMsg)return;const t=setTimeout(()=>setAutoMsg(""),5000);return()=>clearTimeout(t)},[autoMsg]);
  // Ao importar um planejamento novo, a calculadora cria as ondas e o mapa é montado
  // automaticamente. Não exige leitura anterior de desenho nem clique na aba Expedição.
  // Preserva os ajustes existentes e não reinicia uma ocupação já iniciada.
  const [autoVagas,setAutoVagasRaw]=useState(()=>{try{return localStorage.getItem("svc-auto-vagas")!=="0"}catch(e){return true}});
  const setAutoVagas=v=>{setAutoVagasRaw(v);try{localStorage.setItem("svc-auto-vagas",v?"1":"0")}catch(e){}};
  // monta o layout do ciclo c: vagas por transportadora (se automático) + gaiolas da 1ª onda de cada uma
  const montarCiclo=(c,force)=>{
    const src=svcReadPlan();
    if(!src||!src.ondaCalc||!LAYOUTS[c])return null;
    const queue=svcWaveQueue(src);
    if(!queue.length)return null;
    const key=svcOccupationKey(src,c);
    const prior=occupation[c];
    if(!force&&prior&&prior.key===key)return null;
    const existing=edits[c];
    const needsMap=!existing||layoutVazio({map:existing});
    const base=needsMap?LAYOUTS[c].map:existing;
    const map=(autoVagas||force)?svcAutoVagas(base,queue).map:{...base};
    const planned=new Set(queue.map(q=>q.g));
    const prev=tagOv[c]||{};
    const tags={};
    // Rótulos manuais externos ao planejamento não devem desaparecer.
    Object.entries(prev).forEach(([v,g])=>{if(g&&!planned.has(g)&&map[v]!=="X"&&map[v]!=="V")tags[v]=g});
    const ff=svcFirstFill(queue,map,tags);const placed=ff.placed;
    storeEdits({...edits,[c]:map});
    storeTags({...tagOv,[c]:ff.tags});
    saveOccupation({...occupation,[c]:{key,tags:ff.tags,done:[],sug:ff.sug}});
    storeReadAt({...readAt,[c]:new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});
    return {placed,c,sug:ff.sug.length};
  };
  useEffect(()=>{
    const src=svcReadPlan();if(!src||!src.ondaCalc)return;
    const c=detectCiclo(src.title||"",src.rows,src.map||{})||cur;
    const r=montarCiclo(c,false);
    if(r)setAutoMsg(`Layout ${c} montado automaticamente${autoVagas?" (vagas pelo planejamento)":""}: ${r.placed-r.sug} gaiolas da 1ª onda nas vagas${r.sug?` · ${r.sug} da onda seguinte já sugeridas nas vagas que sobraram`:""} · ondas seguintes na aba Expedição.`);
  },[planVer]);
  const montarAgora=()=>{pushHist();return montarCiclo(cur,true)};
  const onRedistribute=()=>{pushHist();stamp();const r=distributeRoutes(L.map,{});storeTags({...tagOv,[cur]:r.tags});return r};
  const onApplyRead=(t,res,dist)=>{pushHist();const m=allV();Object.entries(res.vagas).forEach(([v,k])=>m[v]=k);let tags={...res.gaiolas},placed=0;
    if(dist){const r=distributeRoutes(m,tags);tags=r.tags;placed=r.placed}
    storeEdits({...edits,[t]:m});storeTags({...tagOv,[t]:tags});storeReadAt({...readAt,[t]:new Date().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});if(t!==cur)setCur(t);return {vagas:Object.keys(res.vagas).length,placed}};
  const onReset=()=>{pushHist();const nr={...readAt};delete nr[cur];storeReadAt(nr);const nt={...tagOv};delete nt[cur];storeTags(nt);const ne={...edits};delete ne[cur];storeEdits(ne);const ng={...geos};delete ng[cur];storeGeos(ng)};
  const pick=v=>{setSel(v);setFilter(null)};
  const [infoOpen,setInfoOpenRaw]=useState(()=>{try{return localStorage.getItem("svc-info-open")==="1"}catch(e){return false}});
  const setInfoOpen=v=>{setInfoOpenRaw(v);try{localStorage.setItem("svc-info-open",v?"1":"0")}catch(e){}};
  const pickFilter=k=>{setFilter(k);setSel(null)};
  return html`<div>
    <${Nav} cur=${cur} setCur=${setCur}/>
    <main class="max-w-7xl mx-auto px-4 pt-20 pb-16">
      <div class="mb-4 grid grid-cols-2 sm:grid-cols-4 gap-2" role="tablist" aria-label="Seções do aplicativo">
        ${PAGES.map(p=>html`<button type="button" key=${p.id} role="tab" aria-selected=${page===p.id} onClick=${()=>setPage(p.id)} class="rounded-2xl border text-left px-3 py-3 min-w-0 transition-colors" style=${page===p.id?{background:"rgba(76,195,255,.15)",borderColor:"rgba(76,195,255,.65)",color:"#eaf8ff"}:{background:"rgba(255,255,255,.035)",borderColor:"rgba(255,255,255,.09)",color:"var(--muted)"}}>
          <span class="text-sm font-semibold block"><span class="mr-1.5">${p.icon}</span>${p.label}</span>
          <span class="text-[10px] hidden sm:block mt-1 opacity-70">${p.desc}</span>
        </button>`)}
      </div>
      ${autoMsg&&html`<div class="text-xs rounded-lg px-3 py-1.5 mb-3" style=${{background:"rgba(94,230,176,.1)",color:"#5ee6b0"}}>${autoMsg}</div>`}
      <div role="tabpanel" aria-label="Layout das vagas" style=${{display:page==="layout"?"grid":"none"}} class="grid-cols-1 md:grid-cols-12 gap-4">
        <${VagasAuto} cur=${cur} L=${L} src=${sourceNow()} auto=${autoVagas} setAuto=${setAutoVagas} onMontar=${montarAgora} setCur=${setCur}/>
        <${Plant} cur=${cur} L=${L} filter=${filter} sel=${sel} onPick=${pick} onEdit=${onEdit} onGeo=${onGeo} onTag=${onTag} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} onUndo=${onUndo} onReset=${onReset} canUndo=${(hist[cur]||[]).length>0} edited=${!!edits[cur]||!!geos[cur]||!!(tagOv[cur]&&Object.keys(tagOv[cur]).length)}/>
        ${!layoutVazio(L)&&html`<${Table} cur=${cur} L=${L}/>`}
      </div>
      <div role="tabpanel" aria-label="Calculadora de ondas" style=${{display:page==="ondas"?"grid":"none"}} class="grid-cols-1 md:grid-cols-12 gap-4">
        <${OndasCalc} cur=${cur} L=${L} onRedistribute=${onRedistribute}/>
      </div>
      <div role="tabpanel" aria-label="Planejamento da expedição" style=${{display:page==="expedicao"?"grid":"none"}} class="grid-cols-1 md:grid-cols-12 gap-4">
        <${OcupacaoGradual} cur=${cur} L=${L} src=${sourceNow()} state=${occCurrent()} onStart=${beginOccupation} onRelease=${releaseOccupied} onPromote=${promoteOccupied}/>
      </div>
      <div role="tabpanel" aria-label="Importação do planejamento" style=${{display:page==="importar"?"grid":"none"}} class="grid-cols-1 md:grid-cols-12 gap-4">
        <section class="md:col-span-12 flex flex-col gap-2"><div class="text-[11px] uppercase tracking-[.16em] text-muted font-semibold">Planejamento do ciclo</div>
          ${(()=>{const sp=sourceNow();return sp?html`<div class="text-xs text-muted">Carregado agora: <b class="text-ink">${sp.name||"planejamento"}</b>${sp.at?" · "+sp.at:""}. Para trocar, importe outro:</div>`:null})()}
          <${PlanImport} id="planFileTab" big=${true} setCur=${setCur}/></section>
        <${MontarBar} cur=${cur} setCur=${setCur} onZero=${onZero} onApplyRead=${onApplyRead} onDistribute=${onDistribute} open=${infoOpen} setOpen=${setInfoOpen} L=${L} onPick=${pick}/>
      </div>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</html>
